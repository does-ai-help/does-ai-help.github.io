name: Monthly source access check
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 1 * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_links.py --output build/access-report.json
      - run: pip install -r requirements.txt
      - run: python3 scripts/verify_references.py
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-source-access-report
          path: |
            build/access-report.json
            build/reference-verification.*
