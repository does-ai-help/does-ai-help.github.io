name: Monthly source access check
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 1 * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 scripts/check_links.py --output build/access-report.json
      - run: pip install -r requirements.txt
      - run: python3 scripts/verify_references.py
      - run: python3 scripts/browser_review.py --audit build/reference-verification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monthly-source-access-report
          path: |
            build/access-report.json
            build/reference-verification.*
            build/browser-review-queue.*
