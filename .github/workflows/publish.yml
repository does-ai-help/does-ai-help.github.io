name: Publish static review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [site/**, data/**, manuscript/**, scripts/**, .github/workflows/publish.yml]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 scripts/validate.py
      - run: pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/verify_references.py --strict
      - name: Validate local Chrome receipts and prepare follow-up queue
        if: always()
        run: |
          if [ -f build/reference-verification.json ]; then
            python3 scripts/browser_review.py --strict --audit build/reference-verification.json
          else
            python3 scripts/browser_review.py --strict
          fi
      - run: python3 scripts/check_links.py --strict --pre-deployment
      - run: python3 scripts/validate.py --audit build/reference-verification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pre-publication-verification
          path: build/*report*.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: citation-identity-audit
          path: build/reference-verification.*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: local-chrome-review-queue
          path: build/browser-review-queue.*
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - run: python3 scripts/verify_publication.py
